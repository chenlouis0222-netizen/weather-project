<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>天氣查詢系統</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">
    <h1>🌤 即時天氣查詢</h1>

    <input id="cityInput" placeholder="輸入城市（例如 臺北市）">

    <div class="btn-group">
      <button onclick="getWeather()">查詢天氣</button>
      <button onclick="getLocationWeather()">📍 目前位置</button>
    </div>

    <div id="result">請輸入城市或使用定位</div>
  </div>

  <script src="script.js"></script>

</body>
</html>
