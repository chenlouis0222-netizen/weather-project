<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">

    <h1>🌤 Weather</h1>

    <input id="cityInput"
      placeholder="輸入城市 (Taipei / Tokyo / London)"
      onkeydown="if(event.key==='Enter') getWeather()">

    <div class="btn-group">
      <button onclick="getWeather()">查詢</button>
      <button onclick="getLocationWeather()">📍 定位</button>
    </div>

    <div id="result">請輸入城市</div>

  </div>

  <script src="script.js"></script>

</body>
</html>
