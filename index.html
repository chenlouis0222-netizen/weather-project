<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>🌤 即時天氣查詢系統</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="card">
    <h1>🌤 即時天氣查詢系統</h1>

    <p class="subtitle">輸入城市或使用定位取得天氣</p>

    <input id="cityInput" placeholder="例如：台北市 / 桃園市"
      onkeydown="if(event.key==='Enter') getWeather()">

    <div class="btn-group">
      <button onclick="getWeather()">查詢天氣</button>
      <button onclick="getLocationWeather()">📍 目前位置</button>
    </div>

    <div id="result">請輸入城市或使用定位</div>
  </div>

  <script src="script.js"></script>

</body>
</html>
